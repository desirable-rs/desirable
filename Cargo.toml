
[package]
authors = ["siwilizhao <siwilizhao@gmail.com>"]
categories = [
  "network-programming",
  "asynchronous",
  "web-programming::http-server",
]
description = "A minimal Rust web application framework"
documentation = "https://docs.rs/desirable"
edition = "2024"
keywords = ["desirable", "http", "web", "framework", "async"]
license = "Apache-2.0"
name = "desirable"
publish = true # no accidents while in dev
readme = "README.md"
repository = "https://github.com/desirable-rs/desirable"
version = "1.1.0"

include = [
  "Cargo.toml",
  "LICENSE",
  "src/**/*",   #"build.rs",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "^1.0.100"
async-trait = "^0.1.89"
base64 = "^0.22.0"
bytes = "^1.11.0"
chrono = { version = "^0.4.43", features = ["serde"] }
cookie = "^0.18.0"
hmac = "^0.12.1"
http-body = "^1.0.1"
http-body-util = "^0.1.3"
hyper = { version = "^1.8.1", features = ["full"] }
hyper-util = { version = "^0.1.19", features = ["full"] }
mime = "^0.3.17"
rand = "^0.9.0"
route-recognizer = "^0.3.1"
serde = { version = "^1.0.228", features = ["derive"] }
serde_json = "^1.0.149"
serde_urlencoded = "0.7.1"
sha2 = "^0.10.8"
thiserror = "^2.0.18"
time = "^0.3.36"
tokio = { version = "^1.49.0", features = ["full"] }
tracing = "^0.1.44"
[dev-dependencies]
criterion = "0.8.1"

[[bench]]
name = "benchmarks"
harness = false

[features]
# Nothing by default
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
